<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Padel Stats Austria • Ranking</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="w">
    <div class="h">
      <div>
        <div class="header">
          Padel Stats Austria • Ranking</div>
        <h1 class="t" id="pageTitle">Herren Ranking</h1>
      </div>
      <div class="b-wrap">
        <div id="st" class="b">Initialisiere...</div>
        <button id="reloadBtn" class="btn-rel" style="display:none"
          title="Gespeicherte Daten löschen und frisch laden">↻ Neu laden</button>
      </div>
    </div>
    <div id="kpis" class="kpis"></div>
    <div id="ctrl" class="ctrl">
      <input id="suche" class="inp" placeholder="Spielername suchen...">
      <select id="sort" class="sel">
        <option value="platz">Sortieren: APU-Platz (aufsteigend)</option>
        <option value="punkte_desc">Sortieren: Punkte (absteigend)</option>
        <option value="punkte_asc">Sortieren: Punkte (aufsteigend)</option>
        <option value="eff_desc">Sortieren: Effektivität (absteigend)</option>
        <option value="eff_asc">Sortieren: Effektivität (aufsteigend)</option>
        <option value="apn_desc">Sortieren: APN (absteigend)</option>
        <option value="apn_asc">Sortieren: APN (aufsteigend)</option>
        <option value="matches_desc">Sortieren: Matches (absteigend)</option>
        <option value="matches_asc">Sortieren: Matches (aufsteigend)</option>
        <option value="seit_asc">Sortieren: Aktiv seit (älteste zuerst)</option>
        <option value="seit_desc">Sortieren: Aktiv seit (neueste zuerst)</option>
      </select>
    </div>
    <div id="tw" class="card"></div>
  </div>

  <script>
    (async () => {
      const cacheKey = 'apu_hosted_stats_v1';
      const st = document.getElementById('st');
      let liste = [];

      const updateKpis = () => {
        if (!liste.length) return;
        document.getElementById('pageTitle').textContent = 'Herren Rangliste (Top ' + liste.length + ')';
        const topEff = liste.reduce((a, b) => b.effZ > a.effZ ? b : a, liste[0]);
        const topM = liste.reduce((a, b) => b.mZ > a.mZ ? b : a, liste[0]);
        const topSeit = liste.reduce((a, b) => b.seitZ < a.seitZ ? b : a, liste[0]);

        document.getElementById('kpis').innerHTML =
          '<div class="kpi"><div class="kl">Beste Effektivität</div><div class="kv">' + (topEff && topEff.effZ >= 0 ? topEff.name + ' <span style="color:#34d399">(' + topEff.effT + ')</span>' : '–') + '</div></div>' +
          '<div class="kpi"><div class="kl">Meiste Turnier-Matches</div><div class="kv">' + (topM && topM.mZ >= 0 ? topM.name + ' <span style="color:#60a5fa">(' + topM.mT + ')</span>' : '–') + '</div></div>' +
          '<div class="kpi"><div class="kl">Längster Turnierspieler</div><div class="kv">' + (topSeit && topSeit.seitZ < 9e15 ? topSeit.name + ' <span style="color:#fbbf24;font-size:15px">(seit ' + topSeit.seitT + ')</span>' : '–') + '</div></div>';
      };

      const render = () => {
        const q = document.getElementById('suche').value.toLowerCase();
        const sb = document.getElementById('sort').value;

        const f = liste.filter(x => x.name.toLowerCase().includes(q)).sort((a, b) => {
          const pA = parseInt(String(a.punkte).replace(/\D/g, ''), 10) || 0;
          const pB = parseInt(String(b.punkte).replace(/\D/g, ''), 10) || 0;
          if (sb === 'punkte_desc') return pB - pA;
          if (sb === 'punkte_asc') return pA - pB;
          if (sb === 'eff_desc') return b.effZ - a.effZ;
          if (sb === 'eff_asc') return a.effZ - b.effZ;
          if (sb === 'apn_desc') return b.apnZ - a.apnZ;
          if (sb === 'apn_asc') return a.apnZ - b.apnZ;
          if (sb === 'matches_desc') return b.mZ - a.mZ;
          if (sb === 'matches_asc') return a.mZ - b.mZ;
          if (sb === 'seit_asc') return a.seitZ - b.seitZ;
          if (sb === 'seit_desc') return b.seitZ - a.seitZ;
          return a.platz - b.platz;
        });

        const rows = f.map(x => {
          const p = x.name.split(' ');
          const ini = ((p[0] ? p[0].charAt(0) : '') + (p[1] ? p[1].charAt(0) : '')).toUpperCase();
          const rc = x.platz === 1 ? 'rk r1' : (x.platz === 2 ? 'rk r2' : (x.platz === 3 ? 'rk r3' : 'rk'));
          const av = x.bild ? '<img src="' + x.bild + '" class="pi" loading="lazy">' : '<div class="pn">' + ini + '</div>';
          const fl = x.flag ? '<img src="' + x.flag + '" alt="" style="width:20px;height:14px;object-fit:cover;border-radius:2px;flex-shrink:0">' : '';
          const bw = x.effZ > 0 ? Math.min(100, Math.round(x.effZ)) : 0;

          return '<div class="grid-row grid-body">' +
            '<div><span class="' + rc + '">' + x.platz + '</span></div>' +
            '<div class="pc">' + av + fl + '<a href="' + x.url + '" target="_blank" rel="noopener" class="pl">' + x.name + '</a></div>' +
            '<div class="tr" style="font-weight:700;color:#fff">' + x.punkte + '</div>' +
            '<div class="tr"><span class="apn">' + x.apnT + '</span></div>' +
            '<div class="tr" style="color:#d1d5db">' + x.mT + '</div>' +
            '<div class="tr"><div class="ew"><span style="color:#34d399;font-weight:700">' + x.effT + '</span><div class="eb"><div class="ef" style="width:' + bw + '%"></div></div></div></div>' +
            '<div class="tr" style="color:#9ca3af;font-size:13px">' + x.seitT + '</div>' +
            '</div>';
        }).join('');

        const head = '<div class="grid-row grid-head">' +
          '<div>Platz</div>' +
          '<div class="trr">Spieler</div>' +
          '<div class="tr">Punkte</div>' +
          '<div class="tr">APN</div>' +
          '<div class="tr">Matches</div>' +
          '<div class="tr">Effektivität</div>' +
          '<div class="tr">Aktiv seit</div>' +
          '</div>';

        document.getElementById('tw').innerHTML = head + rows;
      };

      document.getElementById('suche').addEventListener('input', render);
      document.getElementById('sort').addEventListener('change', render);
      document.getElementById('reloadBtn').addEventListener('click', () => {
        localStorage.removeItem(cacheKey);
        location.reload();
      });

      const uniqueByUrl = (arr) => {
        const seen = new Set();
        return (arr || []).filter(item => {
          if (!item || !item.url || seen.has(item.url)) return false;
          seen.add(item.url);
          return true;
        });
      };

      const formatStand = (d) => d && d !== 'aktuell' ? d.replace(' ', ' | ') + ' Uhr' : 'aktuell';

      const gespeichert = localStorage.getItem(cacheKey);
      if (gespeichert) {
        try {
          const parsed = JSON.parse(gespeichert);
          if (parsed && parsed.data && parsed.data.length > 0 && (Date.now() - (parsed.savedAt || 0) < 3600000)) {
            liste = parsed.data;
            st.textContent = '● Stand: ' + formatStand(parsed.datum);
            st.style.color = '#34d399';
            st.style.borderColor = 'rgba(16,185,129,.4)';
            document.getElementById('reloadBtn').style.display = 'inline-block';
            updateKpis();
            render();
            return;
          }
        } catch (e) { }
      }

      try {
        const hourStamp = Math.floor(Date.now() / 3600000);
        const res = await fetch('./data.json?v=' + hourStamp);
        if (!res.ok) throw new Error('Noch keine data.json');
        const json = await res.json();
        liste = json.data || [];

        if (liste.length > 0) {
          try {
            localStorage.setItem(cacheKey, JSON.stringify({
              savedAt: Date.now(),
              datum: json.datum || 'aktuell',
              data: liste
            }));
          } catch (e) { }
          st.textContent = '● Stand: ' + formatStand(json.datum);
          st.style.color = '#34d399';
          st.style.borderColor = 'rgba(16,185,129,.4)';
          document.getElementById('reloadBtn').style.display = 'inline-block';
          updateKpis();
          render();
        } else {
          st.textContent = 'Warte auf ersten Daten-Sync...';
        }
      } catch (e) {
        st.textContent = 'Noch keine data.json vorhanden. Bitte GitHub Action starten.';
      }
    })();
  </script>
</body>

</html>
