<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>APU Herren Stats</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --green: #4ade80;
            --red: #f87171;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 1100px; margin: 0 auto; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; color: var(--accent); }
        .meta { font-size: 0.85rem; color: var(--muted); }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        input, select, button {
            background: var(--card); color: var(--text); border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 8px; font-size: 0.95rem;
        }
        input { flex: 1; min-width: 200px; }
        button { cursor: pointer; font-weight: 600; }
        button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
        .table-wrap { overflow-x: auto; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
        th:hover { color: var(--text); }
        tr:hover { background: rgba(255,255,255,0.03); }
        .fav-btn { background: none; border: none; font-size: 1.2rem; padding: 0; cursor: pointer; color: var(--muted); }
        .fav-btn.is-fav { color: #facc15; }
        .player-cell { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #334155; }
        a { color: var(--text); text-decoration: none; font-weight: 500; }
        a:hover { color: var(--accent); text-decoration: underline; }
        .trend-up { color: var(--green); font-size: 0.8rem; margin-left: 4px; }
        .trend-down { color: var(--red); font-size: 0.8rem; margin-left: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>🎾 APU Herren Rangliste & Stats</h1>
        <div class="meta" id="lastUpdate">Lade Daten...</div>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Spieler suchen...">
        <button id="favFilterBtn">⭐ Nur Favoriten</button>
        <select id="sortSelect">
            <option value="rank">Sortieren: Rang</option>
            <option value="points">Sortieren: Punkte</option>
            <option value="apn">Sortieren: APN</option>
            <option value="eff">Sortieren: Effizienz (Pkt/Spiel)</option>
            <option value="matches">Sortieren: Spiele</option>
        </select>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>★</th>
                    <th>#</th>
                    <th>Spieler</th>
                    <th>Punkte</th>
                    <th>APN</th>
                    <th>Spiele</th>
                    <th>Pkt/Spiel</th>
                    <th>Aktiv seit</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        let players = [];
        let favorites = JSON.parse(localStorage.getItem('apu_favs') || '[]');
        let onlyFavs = false;

        async function loadData() {
            const cached = localStorage.getItem('apu_cache_data');
            const cachedTime = localStorage.getItem('apu_cache_time');

            // LocalStorage nutzen, wenn jünger als 1 Stunde
            if (cached && cachedTime && (Date.now() - parseInt(cachedTime, 10) < 3600000)) {
                renderJSON(JSON.parse(cached));
                return;
            }

            try {
                const res = await fetch('./data.json?t=' + Date.now());
                const data = await res.json();
                localStorage.setItem('apu_cache_data', JSON.stringify(data));
                localStorage.setItem('apu_cache_time', Date.now().toString());
                renderJSON(data);
            } catch (e) {
                document.getElementById('lastUpdate').textContent = 'Noch keine data.json vorhanden. Bitte GitHub Action starten.';
            }
        }

        function renderJSON(data) {
            players = data.players || [];
            const date = new Date(data.updatedAt);
            document.getElementById('lastUpdate').textContent = `Stand: ${date.toLocaleDateString('de-AT')} ${date.toLocaleTimeString('de-AT', {hour: '2-digit', minute:'2-digit'})} (${players.length} Spieler)`;
            renderTable();
        }

        function toggleFav(url) {
            if (favorites.includes(url)) {
                favorites = favorites.filter(u => u !== url);
            } else {
                favorites.push(url);
            }
            localStorage.setItem('apu_favs', JSON.stringify(favorites));
            renderTable();
        }

        function renderTable() {
            const q = document.getElementById('search').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let list = players.filter(p => {
                if (onlyFavs && !favorites.includes(p.url)) return false;
                if (q && !p.name.toLowerCase().includes(q)) return false;
                return true;
            });

            list.sort((a, b) => {
                if (sortBy === 'rank') return a.rank - b.rank;
                return (b[sortBy] || 0) - (a[sortBy] || 0);
            });

            const tbody = document.getElementById('tbody');
            tbody.innerHTML = list.slice(0, 500).map(p => {
                const isFav = favorites.includes(p.url);
                const rankDiff = (p.prevRank || p.rank) - p.rank;
                const trend = rankDiff > 0 ? `<span class="trend-up">▲${rankDiff}</span>` : (rankDiff < 0 ? `<span class="trend-down">▼${Math.abs(rankDiff)}</span>` : '');
                const imgTag = p.img ? `<img src="${p.img}" class="avatar" loading="lazy">` : `<div class="avatar"></div>`;

                return `
                    <tr>
                        <td><button class="fav-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFav('${p.url}')">${isFav ? '★' : '☆'}</button></td>
                        <td><strong>${p.rank}</strong>${trend}</td>
                        <td>
                            <div class="player-cell">
                                ${imgTag}
                                <a href="${p.url}" target="_blank" rel="noopener">${p.name}</a>
                            </div>
                        </td>
                        <td><strong>${p.points.toLocaleString('de-AT')}</strong></td>
                        <td>${p.apn ?? '-'}</td>
                        <td>${p.matches || '-'}</td>
                        <td>${p.eff || '-'}</td>
                        <td>${p.since || '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('search').addEventListener('input', renderTable);
        document.getElementById('sortSelect').addEventListener('change', renderTable);
        document.getElementById('favFilterBtn').addEventListener('click', (e) => {
            onlyFavs = !onlyFavs;
            e.target.classList.toggle('active', onlyFavs);
            renderTable();
        });

        loadData();
    </script>
</body>
</html>
