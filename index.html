<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Padel Stats Austria • Ranking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h2>Padel Stats Austria • Ranking</h2>
      <div>
        <span id="status" style="font-size:13px;color:#94a3b8;margin-right:10px;">Lade Daten...</span>
        <button class="btn" id="reloadBtn">↻ Neu laden</button>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="controls">
      <input class="input" id="search" placeholder="Spieler suchen (z.B. Eiersebner, Alten, Novak...)">
      <select class="select" id="sort">
        <option value="platz_asc">Sortieren: APU-Platz (aufsteigend)</option>
        <option value="punkte_desc">Sortieren: Punkte (absteigend)</option>
        <option value="punkte_asc">Sortieren: Punkte (aufsteigend)</option>
        <option value="apn_desc">Sortieren: APN (absteigend)</option>
        <option value="apn_asc">Sortieren: APN (aufsteigend)</option>
        <option value="matches_desc">Sortieren: Matches (absteigend)</option>
        <option value="matches_asc">Sortieren: Matches (aufsteigend)</option>
        <option value="eff_desc">Sortieren: Effektivität (absteigend)</option>
        <option value="eff_asc">Sortieren: Effektivität (aufsteigend)</option>
        <option value="seit_desc">Sortieren: Aktiv seit (neueste zuerst)</option>
        <option value="seit_asc">Sortieren: Aktiv seit (älteste zuerst)</option>
      </select>
    </div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th data-col="platz">APU-Platz</th>
            <th data-col="name">Spieler</th>
            <th data-col="punkte">Punkte</th>
            <th data-col="apn">APN</th>
            <th data-col="matches">Matches</th>
            <th data-col="eff">Effektivität</th>
            <th data-col="seit">Aktiv seit</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const CACHE_KEY = 'apu_stats_cache_v3';
    let players = [];

    function parseSeitTs(seitStr) {
      if (!seitStr || seitStr === '-') return 0;
      const m = seitStr.match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (!m) return 0;
      return new Date(`${m[3]}-${m[2]}-${m[1]}`).getTime() || 0;
    }

    function renderKPIs() {
      if (!players.length) return;
      const totalPts = players.reduce((s, p) => s + (p.punkte || 0), 0);
      const validApn = players.filter(p => (p.apn || 0) > 0);
      const avgApn = validApn.length ? (validApn.reduce((s, p) => s + p.apn, 0) / validApn.length).toFixed(2) : '-';
      const validEff = players.filter(p => (p.eff || 0) > 0);
      const avgEff = validEff.length ? (validEff.reduce((s, p) => s + p.eff, 0) / validEff.length).toFixed(1) + '%' : '-';
      const totalMatches = players.reduce((s, p) => s + (p.matches || 0), 0);

      document.getElementById('kpis').innerHTML = `
        <div class="card"><div class="card-label">Erfasste Spieler</div><div class="card-val">${players.length}</div></div>
        <div class="card"><div class="card-label">Ø APN Wert</div><div class="card-val">${avgApn}</div></div>
        <div class="card"><div class="card-label">Ø Effektivität</div><div class="card-val">${avgEff}</div></div>
        <div class="card"><div class="card-label">Gespielte Matches</div><div class="card-val">${totalMatches.toLocaleString('de-AT')}</div></div>
      `;
    }

    function renderTable() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const sortVal = document.getElementById('sort').value;

      let list = players.filter(p => !q || p.name.toLowerCase().includes(q));

      list.sort((a, b) => {
        if (sortVal === 'platz_asc') return a.platz - b.platz;
        if (sortVal === 'punkte_desc') return (b.punkte || 0) - (a.punkte || 0);
        if (sortVal === 'punkte_asc') return (a.punkte || 0) - (b.punkte || 0);
        if (sortVal === 'apn_desc') return (b.apn || 0) - (a.apn || 0);
        if (sortVal === 'apn_asc') return (a.apn || 0) - (b.apn || 0);
        if (sortVal === 'matches_desc') return (b.matches || 0) - (a.matches || 0);
        if (sortVal === 'matches_asc') return (a.matches || 0) - (b.matches || 0);
        if (sortVal === 'eff_desc') return (b.eff || 0) - (a.eff || 0);
        if (sortVal === 'eff_asc') return (a.eff || 0) - (b.eff || 0);
        if (sortVal === 'seit_desc') return parseSeitTs(b.seit) - parseSeitTs(a.seit);
        if (sortVal === 'seit_asc') {
          const tsA = parseSeitTs(a.seit) || Infinity;
          const tsB = parseSeitTs(b.seit) || Infinity;
          return tsA - tsB;
        }
        return 0;
      });

      document.getElementById('tbody').innerHTML = list.map(p => {
        const avatar = p.bild
          ? `<img class="avatar" src="${p.bild}" loading="lazy">`
          : `<div class="avatar"></div>`;
        const flag = p.flag
          ? `<img class="flag" src="${p.flag}" alt="Flag" loading="lazy">`
          : '';
        return `
          <tr>
            <td><strong>#${p.platz}</strong></td>
            <td>
              <div class="player">
                ${avatar}
                ${flag}
                <a class="link" href="https://padel-austria.at${p.url}" target="_blank" rel="noopener">${p.name}</a>
              </div>
            </td>
            <td><strong>${(p.punkte || 0).toLocaleString('de-AT')}</strong></td>
            <td><span class="badge">${p.apnT || '-'}</span></td>
            <td>${p.mT || '-'}</td>
            <td>${p.effT || '-'}</td>
            <td>${p.seitT || p.seit || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    async function loadData(force = false) {
      if (!force) {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            players = parsed.players || [];
            updateStatus(parsed);
            renderKPIs();
            renderTable();
          } catch (e) {}
        }
      }

      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error('Keine data.json');
        const data = await res.json();
        players = data.players || [];
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        updateStatus(data);
        renderKPIs();
        renderTable();
      } catch (e) {
        if (!players.length) {
          document.getElementById('status').textContent = 'Warte auf data.json...';
        }
      }
    }

    function updateStatus(data) {
      if (!data.lastUpdated) return;
      const d = new Date(data.lastUpdated);
      document.getElementById('status').textContent =
        `Stand: ${d.toLocaleDateString('de-AT')} ${d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' })} (${players.length} Spieler)`;
    }

    document.getElementById('search').addEventListener('input', renderTable);
    document.getElementById('sort').addEventListener('change', renderTable);
    document.getElementById('reloadBtn').addEventListener('click', () => {
      localStorage.removeItem(CACHE_KEY);
      loadData(true);
    });

    document.querySelectorAll('th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        const sel = document.getElementById('sort');
        if (col === 'platz') {
          sel.value = 'platz_asc';
        } else if (col !== 'name') {
          sel.value = sel.value === `${col}_desc` ? `${col}_asc` : `${col}_desc`;
        }
        renderTable();
      });
    });

    loadData();
  </script>
</body>
</html>
